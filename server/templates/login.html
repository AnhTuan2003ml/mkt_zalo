<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Nexus License</title>
    <style>
        :root {
            color-scheme: light;
            --brand: #2563eb;
            --brand-strong: #1d4ed8;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --surface: #ffffff;
            --radius: 12px;
            --field-h: 46px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            font: 14px/1.55 system-ui, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9; color: var(--ink);
        }
        .card {
            width: min(400px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(15,23,42,.08);
        }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand .logo {
            width: 52px; height: 52px; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            background: #eff6ff; border-radius: 14px; font-size: 26px;
        }
        h1 { font-size: 19px; margin: 0 0 4px; }
        .sub { color: var(--muted); font-size: 13px; margin: 0; }

        label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin: 18px 0 7px; }
        input {
            width: 100%; height: var(--field-h); padding: 0 14px;
            border: 1px solid #cbd5e1; border-radius: var(--radius);
            font-size: 14px; color: var(--ink); background: #fff;
        }
        input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

        button {
            width: 100%; height: var(--field-h); margin-top: 22px;
            border: 0; border-radius: var(--radius);
            background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
            transition: background .15s;
        }
        button:hover { background: var(--brand-strong); }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .msg {
            margin-top: 14px; padding: 10px 12px; border-radius: 10px;
            font-size: 13px; display: none;
        }
        .msg.show { display: block; }
        .msg.err { background: #fef2f2; color: #b91c1c; }
        .msg.ok  { background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body>
    <form class="card" id="loginForm" onsubmit="return doLogin(event)">
        <div class="brand">
            <div class="logo">🔐</div>
            <h1>Nexus License</h1>
            <p class="sub">Đăng nhập quản trị</p>
        </div>

        <label for="email">Email quản trị</label>
        <input type="email" id="email" placeholder="Nhập email admin" autocomplete="username" autofocus>

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">

        <button type="submit" id="btn">Đăng nhập</button>
        <div class="msg" id="msg"></div>
    </form>

    <script>
        function showMsg(text, kind) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg show ' + kind;
        }

        // Hash mật khẩu bằng SHA-256 ngay trên trình duyệt — KHÔNG gửi mật khẩu thô.
        async function sha256Hex(text) {
            var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(function (b) {
                return b.toString(16).padStart(2, '0');
            }).join('');
        }

        async function doLogin(ev) {
            ev.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var btn = document.getElementById('btn');
            document.getElementById('msg').className = 'msg';
            if (!email || !password) { showMsg('Vui lòng nhập email và mật khẩu.', 'err'); return false; }
            if (!(window.crypto && crypto.subtle)) {
                showMsg('Trình duyệt không hỗ trợ mã hóa (cần HTTPS).', 'err'); return false;
            }
            btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
            try {
                var passwordHash = await sha256Hex(password);
                var res = await fetch('/api/admin/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, passwordHash: passwordHash })
                });
                var data = await res.json();
                if (data.success) {
                    showMsg('Đăng nhập thành công, đang chuyển hướng...', 'ok');
                    location.href = '/';
                } else {
                    showMsg(data.error || 'Đăng nhập thất bại.', 'err');
                }
            } catch (ex) {
                showMsg('Lỗi kết nối: ' + ex.message, 'err');
            } finally {
                btn.disabled = false; btn.textContent = 'Đăng nhập';
            }
            return false;
        }
    </script>
</body>
</html>
