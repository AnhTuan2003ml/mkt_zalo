<!-- Tab: Từ số điện thoại -->
<!-- Layout: cột trái = nhập SĐT + bảng kết quả tra cứu (lên trên, dễ thao tác);
     cột phải = cấu hình lịch. -->
<div class="tab-content" id="tab-phone">
    <div class="sched-groups-layout">
        <div class="sched-groups-left-stack sched-groups-left">
        <section class="sched-panel">
            <div class="sched-panel-head">
                <div>
                    <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Danh sách số điện thoại</h3>
                    <p>Mỗi số điện thoại một dòng, sau đó tra thông tin.</p>
                </div>
                <button id="lookupPhonesBtn" class="btn btn-primary btn-sm" onclick="schedLookupPhones()" style="display:inline-flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Tra thông tin</button>
            </div>

            <div class="sched-source-grid">
                <div class="form-group">
                    <label>Chọn tài khoản gửi</label>
                    <div id="schedPhoneAccountDropdown" class="account-dropdown"></div>
                    <input type="hidden" id="schedPhoneAccountId">
                </div>

                <div class="form-group">
                    <label>Danh sách số điện thoại</label>
                    <textarea id="phoneInput" placeholder="Nhập số điện thoại, mỗi số một dòng" style="min-height:58px"></textarea>
                </div>
            </div>
            <div id="phoneLookupStatus" class="sched-inline-status"></div>
        </section>

        <section id="phoneResultsSection" class="sched-panel sched-results-panel" style="display:none">
            <div class="sched-list-toolbar">
                <div>
                    <h3>Chọn người nhận từ tra cứu</h3>
                    <p>Đã chọn <strong id="phoneSelectedCount">0</strong>/<strong id="phoneTotalCount">0</strong> người</p>
                </div>
                <div class="sched-toolbar-actions">
                    <label class="sched-check-pill">
                        <input type="checkbox" id="phoneHeaderCheckbox" onchange="schedTogglePhoneSelectAll(this)">
                        Chọn tất cả
                    </label>
                    <button id="btnSaveSchedulePhone" class="btn btn-success" onclick="schedSaveSchedule()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Lưu lịch</button>
                </div>
            </div>

            <div class="table-scroll sched-table-wrap">
                <table class="recipient-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="phoneSelectAll" onchange="schedTogglePhoneSelectAll(this)"></th>
                            <th>Avatar</th>
                            <th>Tên</th>
                            <th>Số ĐT</th>
                            <th>ID</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="phoneResultsBody"></tbody>
                </table>
            </div>
        </section>
        </div>

        <section class="sched-panel sched-groups-right">
            <div class="sched-panel-head">
                <div>
                    <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Cấu hình lịch</h3>
                    <p>Nội dung, thời gian và tốc độ gửi.</p>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" onclick="schedToggleAdvanced('phone')">Cài đặt nâng cao</button>
            </div>

            <div class="form-group">
                <label>Tiêu đề *</label>
                <input type="text" id="schedPhoneTitle" placeholder="VD: Khuyến mãi tháng 5">
            </div>

            <div class="form-group">
                <label>Nội dung * <span style="font-weight:400;color:var(--text-muted);font-size:11px">(mỗi dòng = 1 mẫu tin, gửi ngẫu nhiên — không lặp liên tiếp)</span></label>
                <textarea id="schedPhoneMessage" placeholder="Mỗi DÒNG là 1 mẫu tin nhắn. Hệ thống chọn ngẫu nhiên mỗi người một mẫu để tránh trùng."></textarea>
                <div style="margin-top:6px">
                    <input type="file" id="schedPhoneMsgFile" accept=".txt" style="display:none" onchange="schedLoadMsgFile(this,'schedPhoneMessage')">
                    <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('schedPhoneMsgFile').click()">📎 Tải file .txt (mỗi dòng 1 tin)</button>
                </div>
            </div>

            <div class="form-group">
                <label>Ảnh đính kèm (tùy chọn)</label>
                <input type="file" id="schedPhonePhotoInput" accept="image/*" style="display:none">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                    <button type="button" class="btn btn-secondary btn-sm" id="schedPhonePhotoBtn">📷 Chọn ảnh</button>
                    <div id="schedPhonePhotoWrap" style="display:none;align-items:center;gap:8px">
                        <img id="schedPhonePhotoPreview" src="" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border,#ddd)">
                        <span id="schedPhonePhotoName" style="font-size:12px;color:var(--text-secondary);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
                        <button type="button" id="schedPhonePhotoRemove" title="Bỏ ảnh" style="border:none;background:rgba(239,68,68,0.12);color:#ef4444;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1">&times;</button>
                    </div>
                </div>
                <small style="color:var(--text-secondary)">Có ảnh: hệ thống gửi ảnh trước, nội dung gửi thành tin nhắn ngay sau.</small>
            </div>

            <div class="form-group">
                <label>Thời gian gửi *</label>
                <input type="datetime-local" id="schedPhoneDateTime">
            </div>

            <div id="phoneAdvancedSettings" class="sched-advanced" style="display:none">
                <div class="sched-mini-grid">
                    <div class="form-group">
                        <label>Min Delay (s)</label>
                        <input type="number" id="schedPhoneMinDelay" value="3" min="1">
                    </div>
                    <div class="form-group">
                        <label>Max Delay (s)</label>
                        <input type="number" id="schedPhoneMaxDelay" value="5" min="2">
                    </div>
                    <div class="form-group">
                        <label>Max Errors</label>
                        <input type="number" id="schedPhoneMaxErrors" value="5" min="1">
                    </div>
                    <div class="form-group">
                        <label>Batch Size</label>
                        <input type="number" id="schedPhoneBatchSize" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Batch Delay (s)</label>
                        <input type="number" id="schedPhoneBatchDelay" value="30" min="1">
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
